name: Release
# Pushing a tag v<version> (matching package.json) publishes that version to npm.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which trusted publishing needs.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      # prepublishOnly runs typecheck and tests (with the network tests here too).
      # With a trusted publisher configured on npmjs.com, npm signs in through OIDC. NPM_TOKEN (a granular
      # token) is only for publishing before that is set up, e.g. the very first release.
      - name: Publish
        env:
          SIGNAL_NETWORK_TESTS: "1"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          npm publish
