[package]
name = "signal-opus"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "libopus (Xiph, BSD-3-Clause) for signal-edge's calls, compiled to wasm32-unknown-unknown"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"

[build-dependencies]
cc = "=1.11.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
