name: WASM
# Builds src/vendor/ (tls/, sealed/ and opus/ compiled to WebAssembly) from source and checks that the committed
# files are exactly what this workflow builds. The build is reproducible: pinned toolchain
# (rust-toolchain.toml, wasm-bindgen-cli 0.2.130, Ubuntu 24.04's clang 18) and local paths mapped away.
# - The build job runs the branch's code (build scripts, Rust build.rs) with a read-only token.
# - attest (push to main): records a build provenance attestation for each .wasm the build produced
#   and that matched the committed files. Verify with:
#     gh attestation verify src/vendor/signal-tls/signal_tls_bg.wasm -R FacePlant101/signal-edge \
#       --signer-workflow FacePlant101/signal-edge/.github/workflows/wasm.yml --source-ref refs/heads/main
# - commit (workflow_dispatch with commit=true): commits the build's output to the branch it ran on, for
#   changes to tls/ or sealed/ made without a local Rust toolchain. It only copies files; no build code
#   runs with write access.
on:
  pull_request:
    paths: ["tls/**", "sealed/**", "opus/**", "src/vendor/**", "scripts/build-*.sh", "rust-toolchain.toml", ".github/workflows/wasm.yml"]
  push:
    branches: [main]
    paths: ["tls/**", "sealed/**", "opus/**", "src/vendor/**", "scripts/build-*.sh", "rust-toolchain.toml", ".github/workflows/wasm.yml"]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the rebuilt src/vendor/ to this branch
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rustc from rust-toolchain.toml, clang/llvm-ar/protoc from Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 llvm-18 protobuf-compiler
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar
          rustup show active-toolchain || rustup toolchain install
          clang --version | head -1; protoc --version; rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: wasm-${{ hashFiles('rust-toolchain.toml', 'tls/Cargo.lock', 'sealed/Cargo.lock', 'opus/Cargo.lock') }}
      - name: wasm-bindgen-cli 0.2.130
        run: wasm-bindgen --version 2>/dev/null | grep -q '0.2.130' || cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: TLS crate tests (host)
        run: cargo test --locked --manifest-path tls/Cargo.toml --target x86_64-unknown-linux-gnu
      - run: bash scripts/build-tls.sh
      - run: bash scripts/build-sealed.sh
      - run: bash scripts/build-opus.sh
      - run: sha256sum src/vendor/*/*.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: vendor
          path: src/vendor/
      - name: The committed files are what this build produced
        if: github.event_name != 'workflow_dispatch' || !inputs.commit
        run: |
          if git diff --quiet src/vendor; then echo "src/vendor/ matches the build"; exit 0; fi
          git diff --stat src/vendor
          echo "::error::src/vendor/ differs from the CI build. Use the 'vendor' artifact of this run, or run this workflow with commit=true on the branch."
          exit 1

  attest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vendor
          path: vendor
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: vendor/*/*.wasm

  commit:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.commit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vendor
          path: src/vendor
      - name: Commit the rebuilt files
        run: |
          git diff --quiet src/vendor && { echo "src/vendor/ is already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Rebuild src/vendor/ (WASM workflow, run ${{ github.run_id }})"
          git push
