[package]
name = "signal-tls"
version = "0.1.0"
edition = "2024"
publish = false
description = "Sans-IO TLS 1.3 client (rustls + ring) pinned to Signal's root CAs, for Cloudflare Workers"

[lib]
crate-type = ["cdylib"]

[dependencies]
# TLS 1.3 only (no tls12 feature), ring provider, no aws-lc (does not build for wasm32).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
# wasm32_unknown_unknown_js: ring draws randomness from crypto.getRandomValues.
ring = { version = "0.17.14", features = ["wasm32_unknown_unknown_js"] }
# web: rustls's std code calls UnixTime::now(), which needs a JS clock on wasm32.
rustls-pki-types = { version = "1.15.1", features = ["web"] }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# Keep the target_features section wasm-bindgen reads; drop only debug info.
strip = "debuginfo"
