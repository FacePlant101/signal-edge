name: Release
# Pushing a tag v<version> (matching package.json, on a commit that is on main) stages that version on npm.
# verify builds and tests the tagged commit and packs it, with a read-only token and no OIDC token;
# publish only uploads that tarball, running no scripts, with the npm environment's credentials, as a
# staged package (npm stage publish): it goes public only once a maintainer approves it with 2FA
# (npmjs.com, or `npm stage approve <stage-id>`; `npm stage list signal-edge` shows the id).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag matches package.json and is on main
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
        env:
          SIGNAL_NETWORK_TESTS: "1"
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: signal-edge-*.tgz

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which trusted publishing needs.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: package
      # npm stage needs npm 11.21 or later; pinned, installed without running scripts.
      - run: npm install --global --ignore-scripts npm@11.21.2
      # With a trusted publisher configured on npmjs.com (allow stage publish only), npm signs in through
      # OIDC. NPM_TOKEN (a granular token without 2FA bypass) is only for before that is set up.
      - name: Stage for approval
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # A version already on npm (0.2.0 was published by hand, before the trusted publisher could
          # be set up) is left alone: npm never accepts the same version twice, staged or published.
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "signal-edge@$version" version 2>/dev/null)" ]; then
            echo "::notice::signal-edge@$version is already on npm; nothing to publish."
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          npm stage publish ./signal-edge-*.tgz --provenance --access public --ignore-scripts
          echo "::notice::signal-edge@$version is staged on npm: approve it with 2FA to publish it."
